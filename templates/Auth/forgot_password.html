{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | First National</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body { background-color: var(--bg-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { width: 100%; max-width: 400px; padding: 3rem; text-align: center; }
        .login-logo { font-family: var(--font-body); color: var(--brand-primary); font-size: 2rem; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-logo">
            <a href="{% url 'app:landing' %}" class="logo-wrapper">
                <img src="{% static 'images/rm.png' %}" alt="First National Logo" class="brand-logo">
            </a>
        </div>
        <h3 class="mb-2">Forgot Password</h3>
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1.5rem;">
            Enter the email on your account and we'll send you a reset link.
        </p>
        <form action="" method="post">
            {% csrf_token %}
            <div class="form-group" style="text-align: left;">
                <label>Email Address</label>
                {{ form.email }}
                {% if form.email.errors %}
                    <small style="color:#dc2626;">{{ form.email.errors.0 }}</small>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; display: block; text-align: center;">Send Reset Link</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            <p style="color: var(--text-secondary);">Remembered it? <a href="{% url 'accounts:login' %}">Sign in.</a></p>
        </div>
    </div>
</body>
</html>
