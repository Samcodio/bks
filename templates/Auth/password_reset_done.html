{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email | First National</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body { background-color: var(--bg-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { width: 100%; max-width: 400px; padding: 3rem; text-align: center; }
        .login-logo { font-family: var(--font-body); color: var(--brand-primary); font-size: 2rem; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-logo">
            <a href="{% url 'app:landing' %}" class="logo-wrapper">
                <img src="{% static 'images/rm.png' %}" alt="First National Logo" class="brand-logo">
            </a>
        </div>
        <h3 class="mb-2">Check Your Email</h3>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">
            If an account exists with that email, we've sent a link to reset your password.
            The link expires in <strong>1 hour</strong>.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary"
           style="width: 100%; display: block; text-align: center; margin-top: 1.5rem;">Back to Sign In</a>
    </div>
</body>
</html>
